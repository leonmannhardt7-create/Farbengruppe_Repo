<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Simple meerkat icon -->
  <circle cx="50" cy="50" r="45" fill="#d4a574"/>
  <circle cx="50" cy="50" r="40" fill="#c89461"/>

  <!-- Ears -->
  <ellipse cx="35" cy="30" rx="8" ry="15" fill="#d4a574"/>
  <ellipse cx="65" cy="30" rx="8" ry="15" fill="#d4a574"/>

  <!-- Eyes -->
  <circle cx="42" cy="45" r="5" fill="#2c2c2c"/>
  <circle cx="58" cy="45" r="5" fill="#2c2c2c"/>
  <circle cx="43" cy="44" r="2" fill="white"/>
  <circle cx="59" cy="44" r="2" fill="white"/>

  <!-- Nose -->
  <ellipse cx="50" cy="55" rx="4" ry="3" fill="#3a3a3a"/>

  <!-- Mouth -->
  <path d="M 50 58 Q 46 60 42 58" stroke="#3a3a3a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 50 58 Q 54 60 58 58" stroke="#3a3a3a" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
